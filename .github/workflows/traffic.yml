name: Update traffic chart

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/traffic.yml
      - scripts/update_traffic_chart.py
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-chart
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Generate cumulative traffic chart
        run: python3 scripts/update_traffic_chart.py

      - name: Commit updated chart
        run: |
          if git diff --quiet -- assets/traffic.svg assets/traffic-history.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/traffic.svg assets/traffic-history.json
          git commit -m "chore: update traffic chart"
          git push
